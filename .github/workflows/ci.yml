name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -m py_compile arena.py games.py
      - name: Datasets are well formed
        run: |
          python - <<'PY'
          from games import GAMES
          for key, game in GAMES.items():
              rounds = game["rounds"]()
              assert rounds, f"{key} has no rounds"
              for i, r in enumerate(rounds):
                  assert {"state", "questions", "gold"} <= r.keys(), f"{key}[{i}] missing fields"
                  assert set(r["gold"]) <= set(r["questions"]), f"{key}[{i}] gold names an unknown question"
              print(f"{key}: {len(rounds)} rounds ok")
          PY
      - name: JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done
